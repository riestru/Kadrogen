<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Kadro.Gen</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f6f9; --bg2:#ffffff; --ink:#0f1419; --ink2:#66707c; --line:#d6dde6; --line2:#e9edf2; --acc:#00b4e6; --acc2:#0a7bd6; --ok:#12b886; --err:#e03131;
          --shadow:0 30px 70px rgba(15,30,50,.10); --glass:rgba(255,255,255,.72); --gridc:rgba(15,20,25,.05); --tipbg:#0f1419; --tipink:#fff; }
  [data-theme=dark] { --bg:#0a0d12; --bg2:#12161d; --ink:#eef2f6; --ink2:#8b95a3; --line:#27303b; --line2:#1a2029; --acc:#22c8f5; --acc2:#3aa0ff;
          --shadow:0 30px 70px rgba(0,0,0,.55); --glass:rgba(18,22,29,.8); --gridc:rgba(255,255,255,.045); --tipbg:#eef2f6; --tipink:#0f1419; }
  * { box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Exo 2", "Segoe UI", system-ui, sans-serif; user-select:none; transition:background .4s, color .4s; }
  .bgl { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bgl::before { content:""; position:absolute; inset:0; background:radial-gradient(1300px 800px at 75% -15%, rgba(0,180,230,.12), transparent 60%), radial-gradient(1000px 700px at -10% 110%, rgba(10,123,214,.10), transparent 60%); }
  .bgl::after { content:""; position:absolute; inset:0; background-image:linear-gradient(var(--gridc) 1px, transparent 1px), linear-gradient(90deg, var(--gridc) 1px, transparent 1px); background-size:72px 72px; mask-image:radial-gradient(ellipse at 50% 40%, #000 25%, transparent 80%); }
  .bgl i { position:absolute; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(0,180,230,.6), transparent); animation:sweep 11s linear infinite; opacity:.6; }
  .bgl i:nth-child(2) { animation-delay:-5.5s; opacity:.3; }
  @keyframes sweep { from { top:-2%; } to { top:102%; } }
  .corner { position:fixed; width:28px; height:28px; border:1.5px solid var(--acc); z-index:0; opacity:.55; pointer-events:none; }
  .corner.tl { left:20px; top:20px; border-right:0; border-bottom:0; } .corner.tr { right:20px; top:20px; border-left:0; border-bottom:0; }
  .corner.bl { left:20px; bottom:20px; border-right:0; border-top:0; } .corner.br { right:20px; bottom:20px; border-left:0; border-top:0; }
  .wrap { position:relative; z-index:1; height:100vh; max-width:1240px; margin:0 auto; padding:32px 52px 50px; display:flex; flex-direction:column; }

  .logo { font:600 20px/1 "Exo 2", sans-serif; letter-spacing:.42em; text-transform:uppercase; color:var(--ink); display:flex; align-items:center; gap:14px; }
  .logo::before { content:""; width:10px; height:10px; background:var(--acc); transform:rotate(45deg); box-shadow:0 0 14px rgba(0,180,230,.9); animation:blink 2.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .logo.big { justify-content:center; font-size:56px; letter-spacing:.52em; font-weight:300; margin:3vh 0 1vh; padding-left:.5em; }
  .logo.big::before { width:16px; height:16px; }
  .logo .k { margin-right:-.42em; } .logo .d { letter-spacing:0; margin:0 .42em; color:var(--acc2); font-weight:600; }
  .logo.big .k { margin-right:-.52em; } .logo.big .d { margin:0 .52em; }
  .logo .thin { font-weight:600; background:linear-gradient(90deg, var(--acc2), var(--acc)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline { text-align:center; font:500 12px/1 "Exo 2", sans-serif; letter-spacing:.5em; text-transform:uppercase; color:var(--ink2); margin-bottom:1vh; }
  #credit { position:fixed; left:0; right:0; bottom:22px; text-align:center; z-index:5; font:500 12px/1 "Exo 2", sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--ink2); pointer-events:none; }
  #credit a { color:var(--acc2); cursor:pointer; pointer-events:auto; text-decoration:none; border-bottom:1px solid transparent; } #credit a:hover { border-bottom-color:var(--acc2); }
  .ctl.help { padding:0 16px; font-size:11px; letter-spacing:.24em; text-transform:uppercase; }
  /* музыка: колонка той же ширины, что кнопка темы, и той же длины, что верхний ряд кнопок (высота ставится из JS) */
  .volbox { position:fixed; right:26px; top:82px; width:46px; height:242px; z-index:2; border:1.5px solid var(--line); background:var(--glass); backdrop-filter:blur(10px); display:grid; grid-template-rows:1fr 44px; justify-items:center;
            clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .volbox .vwrap { display:grid; place-items:center; width:100%; min-height:0; padding:12px 0 8px; }
  .volbox input { -webkit-appearance:none; appearance:none; writing-mode:vertical-lr; direction:rtl; width:20px; height:100%; margin:0; background:transparent; cursor:pointer; }
  .volbox input::-webkit-slider-runnable-track { width:2px; height:100%; background:var(--line); margin:0 auto; }
  .volbox input::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; background:var(--acc2); transform:rotate(45deg); margin-left:-6px; box-shadow:0 0 10px rgba(0,180,230,.6); }
  .volbox .nxt { width:100%; height:44px; border-top:1.5px solid var(--line); display:grid; place-items:center; cursor:pointer; transition:.25s; }
  .volbox .nxt svg { width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; transition:.25s; }
  .volbox .nxt:hover { background:var(--bg2); } .volbox .nxt:hover svg { stroke:var(--acc2); transform:translateX(2px); }
  .volbox .nxt.flash svg { animation:nudge .4s ease; } @keyframes nudge { 50% { transform:translateX(6px); opacity:.4; } }
  .topctl { position:fixed; right:26px; top:26px; z-index:2; display:flex; gap:10px; }
  .ctl { height:46px; min-width:46px; padding:0 12px; border:1.5px solid var(--line); background:var(--glass); backdrop-filter:blur(10px); display:grid; place-items:center; cursor:pointer; transition:.3s; font:600 13px/1 "Exo 2", sans-serif; letter-spacing:.2em; color:var(--ink);
         clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .ctl:hover { border-color:var(--acc2); transform:translateY(-2px); }
  .ctl svg { width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; }
  .ctl .moon { display:none; } [data-theme=dark] .ctl .moon { display:block; } [data-theme=dark] .ctl .sun { display:none; }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; padding-right:130px; }
  .stepname { font:500 12px/1 "Exo 2", sans-serif; letter-spacing:.42em; text-transform:uppercase; color:var(--ink2); }
  .stepname b { color:var(--acc2); font-weight:600; }
  .screen { display:none; flex:1; flex-direction:column; min-height:0; }
  .screen.active { display:flex; animation:enter .5s cubic-bezier(.2,.8,.2,1); }
  .screen.leaving { animation:leave .25s ease forwards; }
  @keyframes enter { from { opacity:0; transform:translateY(22px);} to { opacity:1; transform:none;} }
  @keyframes leave { to { opacity:0; transform:translateY(-14px);} }
  .hint { text-align:center; font:400 15px/1.5 "Exo 2", sans-serif; color:var(--ink2); margin:26px 0 auto; }
  #screen1 .tiles { flex:0 0 auto; margin-top:auto; }
  .hint::before { content:""; display:block; width:44px; height:1px; margin:0 auto 12px; background:linear-gradient(90deg, transparent, var(--acc2), transparent); }

  .tiles { display:grid; gap:22px; align-content:center; flex:1; }
  .tiles.c5 { grid-template-columns:repeat(5, 1fr); gap:18px; }
  .tiles.c6 { grid-template-columns:repeat(6, 1fr); gap:16px; }
  .tiles.c6 .tile svg { width:64px; height:64px; } .tiles.c6 .tile .t { font-size:17px; letter-spacing:.12em; }
  .tiles.c3 { grid-template-columns:repeat(3, 1fr); max-width:900px; margin:0 auto; width:100%; }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; aspect-ratio:1/0.9; max-height:30vh; cursor:pointer;
          background:var(--bg2); border:1.5px solid var(--line); box-shadow:0 10px 30px rgba(15,30,50,.05); transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s, background .4s;
          clip-path:polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px); }
  .tile input { position:absolute; opacity:0; pointer-events:none; }
  .tile svg { width:76px; height:76px; stroke:var(--ink); fill:none; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; transition:.35s; }
  .tiles.c3 .tile svg { width:92px; height:92px; }
  .tile .t { font:500 19px/1.2 "Exo 2", sans-serif; letter-spacing:.16em; text-transform:uppercase; transition:.3s; text-align:center; }
  .tiles.c3 .tile .t { font-size:24px; }
  .tile::before { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg, var(--acc2), var(--acc)); transform:scaleX(0); transform-origin:left; transition:transform .4s cubic-bezier(.2,.8,.2,1); }
  .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(135deg, rgba(0,180,230,.12), transparent 55%); opacity:0; transition:.35s; }
  .tile:hover { transform:translateY(-8px); border-color:var(--acc); box-shadow:var(--shadow); }
  .tile:hover::before { transform:scaleX(1); }
  .tile.sel { border-color:var(--acc2); box-shadow:0 0 0 1px var(--acc2), var(--shadow); transform:translateY(-8px); }
  .tile.sel::before, .tile.sel::after { transform:scaleX(1); opacity:1; }
  .tile.sel svg { stroke:var(--acc2); filter:drop-shadow(0 0 12px rgba(0,180,230,.6)); transform:scale(1.08); }
  .tile.sel .t { color:var(--acc2); }
  .tile .dot { position:absolute; top:16px; right:16px; width:12px; height:12px; border:1.5px solid var(--line); transform:rotate(45deg); transition:.3s; }
  .tile.sel .dot { background:var(--acc2); border-color:var(--acc2); box-shadow:0 0 12px rgba(0,180,230,.9); }
  .q { width:22px; height:22px; border:1.5px solid var(--line); border-radius:50%; display:grid; place-items:center; font:600 12px/1 "Exo 2", sans-serif; color:var(--ink2); transition:.2s; cursor:default; flex:none; }
  .q:hover { border-color:var(--acc2); color:var(--acc2); }
  .tile .q { position:absolute; left:14px; top:12px; z-index:2; }
  #gtip { position:fixed; z-index:50; width:340px; padding:13px 16px; background:var(--tipbg); color:var(--tipink); font:400 13px/1.5 "Exo 2", sans-serif; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; transform:translateY(6px);
          clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  #gtip.show { opacity:1; transform:none; pointer-events:auto; }
  #gtip a { color:var(--acc); font-weight:600; cursor:pointer; text-decoration:underline; display:inline-block; margin-top:4px; margin-right:12px; }

  .qrow { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:22px; }
  .qrow .lbl { font:500 13px/1 "Exo 2", sans-serif; letter-spacing:.3em; text-transform:uppercase; color:var(--ink2); }
  .seg { display:inline-flex; border:1.5px solid var(--line); background:var(--bg2); clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
  .seg label { padding:13px 20px; margin:0; font:500 16px/1 "Exo 2", sans-serif; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; color:var(--ink2); transition:.25s; }
  .seg label:hover { color:var(--ink); }
  .seg input { display:none; }
  .seg input:checked + label { background:var(--ink); color:var(--bg2); }
  .vfrow { display:flex; justify-content:center; align-items:center; gap:16px; margin-top:22px; }
  .vfrow input[type=range] { -webkit-appearance:none; appearance:none; width:300px; height:24px; margin:0; background:transparent; cursor:pointer; }
  .vfrow input[type=range]::-webkit-slider-runnable-track { height:2px; background:var(--line); }
  .vfrow input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-6px; background:var(--acc2); transform:rotate(45deg); box-shadow:0 0 10px rgba(0,180,230,.6); }
  .vfrow .val { min-width:120px; white-space:nowrap; font:600 14px/1 "Exo 2", sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--acc2); font-variant-numeric:tabular-nums; }
  .vfrow .val.zero { color:var(--ink2); }
  .vfrow.hidden { visibility:hidden; }

  .opts { display:flex; flex-direction:column; gap:20px; max-width:640px; margin:0 auto; width:100%; justify-content:center; flex:1; }
  .opt.locked { pointer-events:none; opacity:.6; }
  .opt { position:relative; display:flex; align-items:center; gap:26px; padding:20px 30px; background:var(--bg2); border:1.5px solid var(--line); cursor:pointer; transition:.3s; box-shadow:0 10px 30px rgba(15,30,50,.05);
         clip-path:polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px); }
  .opt input { position:absolute; opacity:0; pointer-events:none; }
  .opt svg { width:64px; height:64px; stroke:var(--ink); fill:none; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; transition:.3s; flex:none; }
  .opt .t { font:500 26px/1.2 "Exo 2", sans-serif; letter-spacing:.14em; text-transform:uppercase; flex:1; }
  .opt .dot { width:14px; height:14px; border:1.5px solid var(--line); transform:rotate(45deg); transition:.3s; flex:none; margin-right:6px; }
  .opt:hover { transform:translateX(6px); border-color:var(--acc); box-shadow:var(--shadow); }
  .opt.sel { border-color:var(--acc2); box-shadow:0 0 0 1px var(--acc2), var(--shadow); }
  .opt.sel .t { color:var(--acc2); } .opt.sel svg { stroke:var(--acc2); filter:drop-shadow(0 0 12px rgba(0,180,230,.6)); }
  .opt.sel .dot { background:var(--acc2); border-color:var(--acc2); box-shadow:0 0 12px rgba(0,180,230,.9); }

  .cols { display:grid; grid-template-columns:1fr 1fr; gap:24px; flex:1; min-height:0; }
  .panel { background:var(--bg2); border:1.5px solid var(--line); padding:20px 24px; box-shadow:0 10px 30px rgba(15,30,50,.05); clip-path:polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px); display:flex; flex-direction:column; min-height:0; transition:background .4s; overflow-y:auto; scrollbar-width:none; }
  .panel::-webkit-scrollbar { display:none; }
  .panel h3 { margin:0 0 8px; font:600 13px/1 "Exo 2", sans-serif; letter-spacing:.4em; text-transform:uppercase; color:var(--acc2); }
  label { display:block; font:500 12px/1 "Exo 2", sans-serif; letter-spacing:.22em; text-transform:uppercase; color:var(--ink2); margin:10px 0 5px; }
  .lk, a[data-url] { color:var(--acc2); cursor:pointer; }
  .lk:hover, a[data-url]:hover { text-decoration:underline; }
  .store { text-align:center; font-size:12px; letter-spacing:.08em; color:var(--ink2); margin:10px auto 0; min-height:16px; }
  .store .lk { margin-left:6px; }
  label .lk { color:var(--acc2); cursor:pointer; text-transform:none; letter-spacing:0; font:500 12px/1 "Exo 2", sans-serif; margin-left:8px; }
  label .lk:hover { text-decoration:underline; }
  input[type=text], input[type=password], input[type=number], select, textarea { width:100%; padding:11px 12px; border:1.5px solid var(--line); background:var(--bg2); font:inherit; color:var(--ink); user-select:text; outline:none; transition:.2s; }
  textarea { resize:none; flex:1; min-height:120px; font-size:14px; line-height:1.5; }
  input:focus, select:focus, textarea:focus { border-color:var(--acc2); box-shadow:0 0 0 3px rgba(0,180,230,.16); }
  select option { background:var(--bg2); color:var(--ink); }
  .row { display:flex; gap:10px; align-items:center; } .row > * { flex:1; } .row > button { flex:0 0 auto; }
  button { padding:11px 18px; border:1.5px solid var(--ink); background:var(--bg2); color:var(--ink); font:600 13px/1 "Exo 2", sans-serif; letter-spacing:.22em; text-transform:uppercase; cursor:pointer; transition:.25s;
           clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  button:hover { background:var(--ink); color:var(--bg2); }
  button.primary { padding:16px 44px; font-size:16px; letter-spacing:.32em; background:var(--ink); color:var(--bg2); border-color:var(--ink); position:relative; overflow:hidden; }
  button.primary::after { content:""; position:absolute; inset:0; background:linear-gradient(110deg, transparent 35%, rgba(0,180,230,.6) 50%, transparent 65%); transform:translateX(-100%); animation:shine 3.4s ease-in-out infinite; }
  @keyframes shine { 45%, 100% { transform:translateX(100%); } }
  button.primary:hover { background:var(--acc2); border-color:var(--acc2); color:#fff; }
  button.danger { border-color:var(--err); color:var(--err); } button.danger:hover { background:var(--err); color:#fff; }
  button.ghost { border-color:var(--line); color:var(--ink2); }
  button.eye { padding:9px 12px; display:grid; place-items:center; } button.eye.on { color:var(--acc2); border-color:var(--acc2); } button.ghost:hover { background:var(--bg2); color:var(--ink); border-color:var(--ink); }
  button:disabled { opacity:.3; cursor:default; }
  .status { font-size:13px; margin-top:5px; min-height:16px; color:var(--ink2); }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .nav { display:flex; justify-content:space-between; align-items:center; padding-top:18px; gap:10px; }
  .subtabs { display:flex; gap:8px; margin-bottom:10px; }
  .subtabs span { padding:8px 14px; border:1.5px solid var(--line); font:600 12px/1 "Exo 2", sans-serif; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; color:var(--ink2); transition:.2s; }
  .subtabs span.on { background:var(--ink); color:var(--bg2); border-color:var(--ink); }
  .engine { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 6px; }
  .engine span { padding:7px 12px; border:1.5px solid var(--line); font:600 11px/1 "Exo 2", sans-serif; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; color:var(--ink2); }
  .engine span.on { background:var(--ink); color:var(--bg2); border-color:var(--ink); }

  .scan { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; margin:0; }
  .opts { gap:14px; }
  .opts .optq { text-align:center; font:400 34px/1.2 "Exo 2", sans-serif; letter-spacing:.14em; text-transform:uppercase; margin:0 0 10px; color:var(--ink); }
  .opts .grp { font:600 12px/1 "Exo 2", sans-serif; letter-spacing:.4em; text-transform:uppercase; color:var(--acc2); padding:0 4px; }
  .opts .grp.sec { margin-top:22px; color:var(--ink2); position:relative; }
  .opts .grp.sec::before { content:""; position:absolute; left:0; right:0; top:-14px; height:1px; background:linear-gradient(90deg, var(--line), transparent); }
  .opt.sec { padding:14px 26px; opacity:.85; } .opt.sec svg { width:46px; height:46px; } .opt.sec .t { font-size:21px; }
  .rwrow { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rwrow label { margin-top:8px; } .rwrow input { width:100%; box-sizing:border-box; }
  .alist { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:4px 2px; }
  .alist::-webkit-scrollbar { display:none; }
  .alist.over { outline:1.5px dashed var(--acc2); outline-offset:6px; }
  .alist-in { margin:auto; width:100%; max-width:1180px; display:flex; flex-direction:column; gap:16px; }
  .lrow { display:grid; grid-template-columns:minmax(200px, 27%) 1fr; align-items:center; column-gap:26px; background:var(--bg2); border:1.5px solid var(--line); padding:18px 22px 18px 26px;
          box-shadow:0 10px 30px rgba(15,30,50,.05); position:relative; animation:enter .35s ease both; transition:border-color .3s, box-shadow .3s; }
  .lrow::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg, var(--acc2), var(--acc)); opacity:0; transition:.3s; }
  .lrow:hover { border-color:var(--acc2); box-shadow:0 14px 36px rgba(0,120,200,.10); } .lrow:hover::before { opacity:1; }
  .lrow .lab { font:500 16px/1.25 "Exo 2", sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
  .lrow .lab .lk { display:block; color:var(--acc2); font-size:13px; letter-spacing:.02em; text-transform:none; margin-top:4px; }
  .lrow .ctl { display:flex; align-items:stretch; border:1.5px solid var(--line); height:52px; min-width:0; background:var(--bg); }
  .lrow .ctl > * { border:0; border-left:1.5px solid var(--line); border-radius:0; height:100%; margin:0; box-shadow:none; }
  .lrow .ctl > :first-child { border-left:0; }
  .lrow .ctl input, .lrow .ctl textarea, .lrow .ctl select { background:transparent; padding:0 16px; font-size:16px; min-width:0; }
  .lrow .ctl input:focus, .lrow .ctl textarea:focus, .lrow .ctl select:focus { box-shadow:inset 0 0 0 1.5px var(--acc2); }
  .lrow .ctl input { flex:1; }
  .lrow .ctl textarea { flex:1 1 auto; width:auto; min-width:0; resize:none; }
  .lrow .ctl select.sel { width:auto; flex:0 0 auto; font:600 12px/1 "Exo 2", sans-serif; letter-spacing:.14em; text-transform:uppercase; padding:0 36px 0 16px; cursor:pointer; }
  .lrow .ctl input[type=number] { flex:0 0 150px; }

    H.push(row(t('voiceid'), 'https://elevenlabs.io/voice-library', `<input type="text" id="tts_voice" list="voice_list" value="${esc(F.voice)}" placeholder="${esc(t('ph_voice'))}" spellcheck="false" autocomplete="off"><button class="ghost" onclick="loadVoices()">${t('list')}</button>`, 's_voice'));
    if (!rwOn()) H.push(row(t('script'), '', `<textarea id="script" spellcheck="false" placeholder="${esc(t('ph_script'))}">${esc(F.script)}</textarea>`));
  } else {
    H.push(row(t('file_lbl'), '', `<input type="text" id="file_name" readonly value="${esc(audioPath)}" placeholder="${esc(t('drop_hint'))}"><button onclick="pick()">${t('pick')}</button>`));
  }
  $('dropzone').innerHTML = `<div class="alist-in">${H.join('')}</div>`;
  bindAccess(); renderVoiceList();
}
function bindAccess() {
  const on = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };
  document.querySelectorAll('#dropzone input.key').forEach(inp => inp.addEventListener('change', () => {
    const k = inp.dataset.k, v = inp.value.trim();
    if (IMG.includes(k)) { keyRows[k][+inp.dataset.i].value = v; saveKeys(); return; }
    if (TTS_SVCS.includes(k)) ttsKeys[k] = v; else if (inp.id === 'k_rw') rwKeys[k] = v; else single[k] = v;
    if (v && !v.includes('•')) pywebview.api.save_config({[k]: v});
  }));
  on('stt_sel', 'change', () => { syncAll(); stt = $('stt_sel').value; pywebview.api.save_config({stt_engine: stt}); renderAccess(); });
  on('llm_sel', 'change', () => { syncAll(); llm = $('llm_sel').value; pywebview.api.save_config({llm_engine: llm}); renderAccess(); });
  document.querySelectorAll('input.base').forEach(el => el.addEventListener('change', () => { const s = el.dataset.svc, v = el.value.trim(); baseUrls[s] = v; pywebview.api.save_config({[s + '_base_url']: v}); }));
  on('tts_sel', 'change', () => { syncAll(); tts = $('tts_sel').value; pywebview.api.save_config({tts_service: tts}); renderAccess(); });
  on('rw_src', 'change', () => { syncAll(); rwSrc = $('rw_src').value; pywebview.api.save_config({rewrite_source: rwSrc}); renderAccess(); });
  on('rw_eng', 'change', () => { syncAll(); rwEngine = $('rw_eng').value; pywebview.api.save_config({rewrite_engine: rwEngine}); renderAccess(); });
  for (const m of Object.keys(MODEL_OPTS)) on(m, 'change', () => { models[m] = $(m).value; pywebview.api.save_config({[m]: models[m]}); });
  on('rw_url', 'change', () => { syncF(); pywebview.api.save_config({rewrite_url: F.rwUrl}); });
  on('rw_words', 'change', () => { syncF(); pywebview.api.save_config({rewrite_words: F.rwWords}); });
  on('rw_lang', 'change', () => { syncF(); pywebview.api.save_config({rewrite_lang: F.rwLang}); });
  on('tts_voice', 'change', () => { syncF(); pywebview.api.save_config({tts_voice: F.voice}); });
  on('tts_voice', 'input', showVoice);
  on('rw_text', 'input', syncF); on('script', 'input', syncF);
}
function syncF() { if ($('script')) F.script = $('script').value; if ($('rw_url')) F.rwUrl = $('rw_url').value.trim(); if ($('rw_text')) F.rwText = $('rw_text').value; if ($('rw_words')) F.rwWords = $('rw_words').value; if ($('rw_lang')) F.rwLang = $('rw_lang').value.trim(); if ($('tts_voice')) F.voice = $('tts_voice').value.trim(); }
function syncRows() {
  document.querySelectorAll('#dropzone input.key').forEach(inp => { const k = inp.dataset.k, v = inp.value.trim();
    if (IMG.includes(k)) keyRows[k][+inp.dataset.i].value = v; else if (TTS_SVCS.includes(k)) ttsKeys[k] = v; else if (inp.id === 'k_rw') rwKeys[k] = v; else single[k] = v; });
}
function syncAll() { syncRows(); syncF(); }
function addKey(p) { syncAll(); keyRows[p].push({idx:-1, value:''}); renderAccess(); const e = $(`k_${p}_${keyRows[p].length - 1}`); if (e) e.focus(); }
function rmKey(p, i) { syncAll(); keyRows[p].splice(i, 1); renderAccess(); saveKeys(); }
function setKeysFromConfig(c) { for (const p of IMG) { const blank = keyRows[p].some(r => !r.value); keyRows[p] = (c.keys && c.keys[p] || []).map((v, i) => ({idx: i, value: v})); if (blank || !keyRows[p].length) keyRows[p].push({idx:-1, value:''}); } }
async function toggle(id) {
  const e = $(id); if (!e) return;
  const btn = e.nextElementSibling;
  if (e.type === 'password') {
    if (e.value.includes('•')) {
      const k = e.dataset.k, idx = IMG.includes(k) ? (keyRows[k][+e.dataset.i] || {}).idx : 0;
      let full = '';
      try { full = await pywebview.api.reveal_key(k, idx); } catch (err) { full = ''; }
      if (!full) return;  // ключ ещё не сохранён — показывать нечего
      e.value = full;
    }
    e.type = 'text'; if (btn) btn.classList.add('on');
  } else {
    e.type = 'password'; if (btn) btn.classList.remove('on');
  }
}
async function checkRow(k, i, sid) {
  if (sid === 's_tts') k = tts; else if (sid === 's_rw') k = rwEngine; else if (sid === 's_llm') k = llm;  // проверяем то, что выбрано сейчас
  const put = (v, cls) => { const e = $(sid); if (e) { e.textContent = v; e.className = 'status st ' + cls; } };
  put(t('checking'), '');
  await saveKeys();
  put(t('checking'), '');
  let r = {};
  try { r = await pywebview.api.check_keys([k]); } catch (err) { r = {[k]: t('error') + err}; }
  const v = Array.isArray(r[k]) ? (r[k][i] ?? r[k][0]) : r[k];
  put(v || '', String(v || '').startsWith('OK') ? 'ok' : 'err');
}
function setSource(v) { source = v; $('use_tts').checked = v === 'script'; mark(); pywebview.api.save_config({source: v}); if (cur === 4) renderAccess(); }
window.setScript = function (text) { F.script = text; if (rwOn() && rwSrc === 'text') { F.rwText = text; const e = $('rw_text'); if (e) e.value = text; } else { const e = $('script'); if (e) e.value = text; } $('s_prep').textContent = ''; };
window.setAudio = function (p) { audioPath = p; const e = $('file_name'); if (e) e.value = p; $('s_prep').textContent = ''; };
function applyLang() {
  document.documentElement.lang = L; $('langbtn').textContent = L === 'ru' ? 'EN' : 'RU';
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = t(el.dataset.i18n); if (v !== undefined) el.innerHTML = v; });
  drawVf();
  $('hint1').textContent = t('hint1'); $('hint1').style.color = '';
  $('g_title').textContent = t('frames'); $('credit').innerHTML = t('credit');
  if (cur === 4) renderAccess();
  mark();
}
async function saveKeys() {
  syncAll();
  const p = provs(), fg = p.includes('fastgen');
  const data = {...models, keys: {}};
  for (const k of IMG) if (p.includes(k)) data.keys[k] = keyRows[k].map(r => ({idx: r.idx, value: r.value}));
  if (!fg) for (const k of [stt === 'assemblyai' ? 'assemblyai' : 'openai', llm]) if (single[k] && !single[k].includes('•')) data[k] = single[k];
  if (source === 'script') { if (ttsKeys[tts] && !ttsKeys[tts].includes('•')) data[tts] = ttsKeys[tts]; data.tts_voice = F.voice; }
  if (rwOn()) { const v = rwKeys[rwEngine] || ''; if (v && !v.includes('•')) data[rwEngine] = v; Object.assign(data, {rewrite_engine: rwEngine, rewrite_source: rwSrc, rewrite_url: F.rwUrl, rewrite_words: F.rwWords, rewrite_lang: F.rwLang}); }
  await pywebview.api.save_config(data);
  const c = (await pywebview.api.get_state()).config;
  setKeysFromConfig(c);
  for (const k of ['openai','anthropic','gemini','assemblyai']) single[k] = c['has_' + k] ? c[k] : '';
  for (const k of TTS_SVCS) if (c['has_' + k]) ttsKeys[k] = c[k];
  for (const k of ['fastgen','openai','anthropic','gemini']) rwKeys[k] = c['has_' + k] ? (k === 'fastgen' ? (c.keys.fastgen[0] || '') : c[k]) : '';
  if (cur === 4 && !(document.activeElement && document.activeElement.closest('#dropzone'))) renderAccess();
}
function renderVoiceList(extra) {
  if (!$('voice_list')) return;
  const mine = recent.filter(v => !v.service || v.service === tts);
  const items = [...mine.map(v => ({id: v.id, name: t('recent_tag')})), ...(extra || [])];
  $('voice_list').innerHTML = items.map(v => `<option value="${esc(v.id)}">${esc(v.name || '')}</option>`).join('');
  voiceNames = {}; (extra || []).forEach(v => { voiceNames[v.id] = v.name || ''; }); voicesLoaded = !!(extra && extra.length);
  const e = $('s_voice'); if (e) { e.textContent = mine.length ? t('recent') + mine.slice(0, 5).map(v => v.id).join(', ') : t('recent_none'); e.className = 'status st'; }
  showVoice();
}
let voiceNames = {}, voicesLoaded = false;
function showVoice() {
  const e = $('s_voice'), f = $('tts_voice'); if (!e || !f) return;
  const id = f.value.trim(); if (!id || !voicesLoaded) return;
  if (voiceNames[id] !== undefined) { e.textContent = t('voice_ok') + (voiceNames[id] || id); e.className = 'status st ok'; }
  else { e.textContent = t('voice_unknown'); e.className = 'status st'; }
}
async function loadVoices() {
  await saveKeys(); const st = $('s_tts'); if (st) { st.textContent = t('loading'); st.className = 'status st'; }
  const r = await pywebview.api.tts_voices(tts);
  if (!r.ok) { if (st) { st.textContent = r.error; st.className = 'status st err'; } return; }
  renderVoiceList(r.voices.map(v => ({id: v.id, name: `${v.name}${v.lang ? ' · ' + v.lang : ''}${v.gender ? ' · ' + v.gender : ''}`})));
  if (st) { st.textContent = r.voices.length ? t('voices_n').replace('{n}', r.voices.length) : t('voices_none'); st.className = 'status st ok'; }
}
function opts() { syncAll(); return {audio: audioPath, source, script: F.script, tts, voice: F.voice, providers: provs(), mode: mode(), use_refs: fgq() === 'quality', subtitles: $('use_subs').checked, motion: $('use_motion').checked, hd: $('use_hd').checked, video_first: vf(),
  rewrite: {on: rwOn(), source: rwSrc, url: F.rwUrl, text: F.rwText, engine: rwEngine, words: F.rwWords, language: F.rwLang}}; }

// ===== фоновая музыка: плейлист из папки music, ползунок 0..100 (середина — тихо, низ — выключено),
// треки по кругу с паузой полторы минуты, стрелка — следующий трек сразу =====
const bgm = $('bgm'); let musicTimer = null, tracks = [], trackIdx = 0;
const MUSIC_GAP = 90000;
function musicGain(v) { return v <= 0 ? 0 : Math.pow(v / 100, 2) * 0.45; }  // 50 → 0.11, 100 → 0.45 (на четверть тише, чем раньше)
function setTracks(list) { tracks = list || []; if (tracks.length) { trackIdx = Math.floor(Math.random() * tracks.length); bgm.src = 'music/' + tracks[trackIdx]; } }
function playTrack(i) { if (!tracks.length) return; trackIdx = (i + tracks.length) % tracks.length; bgm.src = 'music/' + tracks[trackIdx]; bgm.currentTime = 0; bgm.play().catch(() => {}); }
function applyMusic(v) {
  bgm.volume = musicGain(v);
  if (v <= 0) { bgm.pause(); clearTimeout(musicTimer); musicTimer = null; return; }
  if (bgm.paused && !musicTimer && bgm.src) bgm.play().catch(() => {});
}
bgm.addEventListener('ended', () => { clearTimeout(musicTimer); musicTimer = setTimeout(() => { musicTimer = null; if (+$('vol').value > 0) playTrack(trackIdx + 1); }, MUSIC_GAP); });
$('nxt').addEventListener('click', () => { clearTimeout(musicTimer); musicTimer = null; $('nxt').classList.remove('flash'); void $('nxt').offsetWidth; $('nxt').classList.add('flash'); if (+$('vol').value <= 0) { $('vol').value = 35; applyMusic(35); pywebview.api.save_config({music: 35}); } playTrack(trackIdx + 1); });
$('vol').addEventListener('input', () => applyMusic(+$('vol').value));
$('vol').addEventListener('change', () => pywebview.api.save_config({music: +$('vol').value}));
document.addEventListener('click', () => { if (+$('vol').value > 0 && bgm.paused && !musicTimer && bgm.src) bgm.play().catch(() => {}); }, {capture: true});
// музыка играет и когда окно свёрнуто или неактивно — по просьбе пользователя
// колонка музыки такой же длины, как ряд кнопок сверху
function fitVolbox() { const w = document.querySelector('.topctl').getBoundingClientRect().width; $('volbox').style.height = Math.round(w) + 'px'; }
window.addEventListener('resize', fitVolbox); document.fonts && document.fonts.ready.then(fitVolbox);
window.addEventListener('pywebviewready', () => loadConfig(false));
</script>
